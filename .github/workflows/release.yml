name: Release

# Publishes to NuGet when you publish a GitHub Release.
# Create the release with a tag like `v2.1.0` - MinVer turns that tag into the package version.
on:
  release:
    types: [ published ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags so MinVer derives the version from the release tag

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack
        run: dotnet pack NLightTemplate/NLightTemplate.csproj --configuration Release -p:ContinuousIntegrationBuild=true --output artifacts

      # NuGet Trusted Publishing
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: kylepmanuel
      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
